services:
  postgres:
    image: postgres:16.15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
  kestra: 
    image: kestra/kestra:v1.3.40
    # Kestra, by default, has a termination grace period of 5m. We need to wait a little more to be sure no active tasks are running.
    stop_grace_period: 6m
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    env_file: .env
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      # Flows versionados. Nombre de archivo obligatorio: <tenant>_<namespace>_<id>.yml (ej. main_m5.pipeline_hello.yml)
      - ./kestra:/app/flows
    environment:
      # Config no secreta de Snowflake, reutilizando las variables de .env.
      # Kestra expone las variables ENV_* en los flows como {{ envs.snowflake_account }}, etc.
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            driverClassName: org.postgresql.Driver
            username: "${POSTGRES_USER}"
            password: "${POSTGRES_PASSWORD}"
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /app/flows
        kestra:
          server:
            basic-auth:
              username: "${KESTRA_USER}" # it must be a valid email address
              password: "${KESTRA_PASSWORD}" # it must be at least 8 characters long with uppercase letter and a number
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
          # No cargar los flows de ejemplo ("Getting Started") al iniciar
          tutorial-flows:
            enabled: false
    ports:
      - "8080:8080"
      # The following is the management port, not exposed by default.
      # Note that exposing the management port is intended for development purpose as this port is un-authenticated by default
      # and expose sensitive information and actions.
      # - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  spark-master:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8090:8080"      #  Master UI (Kestra already uses 8080 on the host)
    volumes:
      - ./spark:/opt/spark-apps

  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_CORES=2
    ports:
      - "8091:8081"      #  Worker UI
    volumes:
      - ./spark:/opt/spark-apps
    depends_on:
      - spark-master
  
  dbt:
    image: ghcr.io/dbt-labs/dbt-snowflake:1.9.0
    platform: linux/amd64 
    profiles: ["tools"]
    env_file: .env
    environment:
      - DBT_PROFILES_DIR=/usr/app/dbt
    volumes:
      - ./dbt:/usr/app/dbt
      - ${SNOWFLAKE_PRIVATE_KEY_PATH}:/secrets/rsa_key.p8:ro
  
volumes:
  postgres_data:
  kestra_data: