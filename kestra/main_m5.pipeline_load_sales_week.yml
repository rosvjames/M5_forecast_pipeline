id: load_sales_week
namespace: m5.pipeline
description: Flow 2. Carga incremental semanal de ventas. Un simulador de fuente publica la entrega de la semana (CSV ancho, unload en Snowflake) y la ingesta la copia tal cual a SALES_RAW, leyendo columnas por nombre. Requiere que ingest_raw haya creado los objetos de Bronze.

# El backfill lanza cientos de ejecuciones: que corran de a una.
# QUEUE: las que sobran esperan su turno (no se cancelan ni fallan).
concurrency:
  limit: 1
  behavior: QUEUE

# Reloj simulado: el sábado del ancla es la semana 0 (d_1). Cada sábado posterior avanza una semana.
# Con este ancla, k = 277 (última semana, d_1940..d_1941) llega el sábado 2026-10-03.
variables:
  anchor_date: "2021-06-12T00:00:00Z"

inputs:
  # required: false porque cuando llegue el trigger vendrá vacío.
  - id: week_idx
    type: INT
    required: false
    description: Semana a cargar (0..277). Semana k = días d_(7k+1) .. d_min(7k+7, 1941).

  # Solo para la demo de manejo de errores. TRANSIENT falla el 1.er intento de load_week; PERMANENT falla todos.
  - id: simulate_failure
    type: SELECT
    values:
      - NONE
      - TRANSIENT
      - PERMANENT
    defaults: NONE

pluginDefaults:
  - type: io.kestra.plugin.jdbc.snowflake
    values:
      url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?MULTI_STATEMENT_COUNT=0"
      username: "{{ envs.snowflake_user }}"
      privateKey: "{{ secret('SNOWFLAKE_PRIVATE_KEY') }}"
      role: "{{ envs.snowflake_role }}"
      warehouse: "{{ envs.snowflake_warehouse }}"
      database: "{{ envs.snowflake_database }}"

tasks:
  # k = input si viene; si no, semanas completas desde el ancla hasta la fecha lógica:
  #   trigger.date (cron o backfill) ?? execution.startDate (manual sin input = "la semana de hoy").
  # | timestamp da epoch en segundos (Long); 604800 = segundos en una semana.
  # (s - s % 604800) / 604800 = división entera exacta. Fechas antes del ancla → -1 (fuera de rango),
  # porque el % de Java trunca hacia cero y sin este caso darían k = 0.
  - id: compute_week
    type: io.kestra.plugin.core.output.OutputValues
    values:
      week_idx: >-
        {%- if inputs.week_idx is not null -%}{{ inputs.week_idx }}
        {%- else -%}
        {%- set s = ((trigger.date ?? execution.startDate) | timestamp) - (vars.anchor_date | timestamp) -%}
        {%- if s < 0 -%}-1{%- else -%}{{ (s - s % 604800) / 604800 }}{%- endif -%}
        {%- endif -%}

  # Rango de días de la semana k (separado porque un OutputValues no puede leer sus propios valores).
  - id: week_range
    type: io.kestra.plugin.core.output.OutputValues
    values:
      d_ini: "{{ 7 * (outputs.compute_week.values.week_idx | number) + 1 }}"
      d_fin: "{{ min(7 * (outputs.compute_week.values.week_idx | number) + 7, 1941) }}"

  # Fuera de rango no hace nada: evita que un tick posterior al 2026-10-03 pida columnas $1950 que no existen.
  - id: check_range
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.compute_week.values.week_idx | number) >= 0 and (outputs.compute_week.values.week_idx | number) <= 277 }}"
    then:
      # ---------- SIMULADOR DE FUENTE ----------
      # M5 es un único archivo estático. Esta tarea hace de "Walmart publicando la semana k": genera la entrega
      # semanal en el formato de la fuente (CSV ancho con encabezado: jerarquía + d_ini..d_fin) y la deja en la
      # zona de entrega del stage, m5/sales_weekly/sales_wk_<k>.csv.gz, como evidencia inmutable de cada entrega.
      # En un caso real no existiría: el archivo llegaría solo.
      # Unload (COPY INTO @stage) dentro de Snowflake: los datos no salen del stage (~2 s por semana).
      # Lee por posición ($n) porque hace de fuente y conoce su propio formato (d_n = columna n + 6).
      # La INGESTA de abajo, en cambio, no conoce ninguna columna: carga por el nombre del encabezado.
      - id: publish_week
        type: io.kestra.plugin.jdbc.snowflake.Query
        sql: |
          {% set k = outputs.compute_week.values.week_idx | number %}
          {% set d_ini = outputs.week_range.values.d_ini | number %}
          {% set d_fin = outputs.week_range.values.d_fin | number %}
          COPY INTO @M5.BRONZE.RAW_STAGE/m5/sales_weekly/sales_wk_{{ k }}.csv.gz
          FROM (
            SELECT $1 AS "id", $2 AS "item_id", $3 AS "dept_id", $4 AS "cat_id", $5 AS "store_id", $6 AS "state_id"
                   {% for n in range(d_ini, d_fin) %}, ${{ n + 6 }} AS "d_{{ n }}"{% endfor %}
            FROM @M5.BRONZE.RAW_STAGE/m5/sales_train_evaluation.csv.gz (FILE_FORMAT => 'M5.BRONZE.CSV_M5')
          )
          FILE_FORMAT = (TYPE = CSV COMPRESSION = GZIP)
          HEADER = TRUE
          SINGLE = TRUE
          OVERWRITE = TRUE
        retry:
          type: exponential
          interval: PT10S
          maxInterval: PT2M
          maxAttempts: 3

      # ---------- INGESTA ----------
      # DELETE → COPY → UPDATE → LOAD_LOG en una sola transacción: re-ejecutar una semana la reemplaza.
      # COPY por NOMBRE de columna (MATCH_BY_COLUMN_NAME): la ingesta no sabe qué columnas trae el archivo.
      #   Las d_N nuevas las crea Snowflake (ENABLE_SCHEMA_EVOLUTION en SALES_RAW); si la fuente reordena o
      #   agrega columnas, cada valor sigue llegando a la suya. No se transforma nada: el unpivot es de Silver.
      # week_idx y _batch_id no vienen en el archivo y MATCH_BY_COLUMN_NAME no admite constantes:
      #   se completan con el UPDATE (solo toca las filas recién cargadas, que son las únicas con week_idx NULL).
      #   _loaded_at también: MATCH_BY_COLUMN_NAME no aplica el DEFAULT de la columna y la dejaría NULL.
      # FORCE = TRUE: el historial de carga del COPY saltaría un archivo ya cargado; aquí se recarga a propósito.
      - id: load_week
        type: io.kestra.plugin.jdbc.snowflake.Queries
        sql: |
          {% set k = outputs.compute_week.values.week_idx | number %}
          DELETE FROM M5.BRONZE.SALES_RAW WHERE week_idx = {{ k }};
          {% if inputs.simulate_failure == 'PERMANENT'
                or (inputs.simulate_failure == 'TRANSIENT' and taskrun.attemptsCount == 0) %}
          SELECT 1/0;   -- falla simulada, solo para la demo: va después del DELETE para mostrar el rollback
          {% endif %}

          COPY INTO M5.BRONZE.SALES_RAW
          FROM @M5.BRONZE.RAW_STAGE/m5/sales_weekly/sales_wk_{{ k }}.csv.gz
          FILE_FORMAT = (FORMAT_NAME = 'M5.BRONZE.CSV_M5_HEADER')
          MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE
          INCLUDE_METADATA = (_source_file = METADATA$FILENAME, _source_row = METADATA$FILE_ROW_NUMBER)
          ON_ERROR = ABORT_STATEMENT
          FORCE = TRUE;

          UPDATE M5.BRONZE.SALES_RAW
          SET week_idx = {{ k }}, _batch_id = '{{ execution.id }}', _loaded_at = CURRENT_TIMESTAMP()
          WHERE week_idx IS NULL;

          INSERT INTO M5.BRONZE.LOAD_LOG (batch_id, flow_id, week_idx, table_name, rows_loaded, status)
          SELECT '{{ execution.id }}', '{{ flow.id }}', {{ k }}, 'SALES_RAW', COUNT(*), 'SUCCESS'
          FROM M5.BRONZE.SALES_RAW
          WHERE week_idx = {{ k }};
        # Si Snowflake se cuelga, con concurrency 1 bloquearía todo el backfill detrás.
        timeout: PT10M
        # Retry seguro: todo va en una transacción, un intento fallido se deshace completo y no duplica.
        retry:
          type: exponential
          interval: PT10S
          maxInterval: PT2M
          maxAttempts: 3
    else:
      - id: out_of_range
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "week_idx={{ outputs.compute_week.values.week_idx }} fuera de rango (0..277). No se carga nada."

# Solo corre si una tarea falló después de agotar sus retries.
# El Log va primero: si lo que falla es la conexión a Snowflake, el INSERT también falla, pero el Log queda en Kestra.
# week_idx ?? 'NULL': si falló antes de compute_week, ese output no existe.
# Comillas simples escapadas ('' ) para no romper el SQL, y mensaje recortado a 1000 caracteres.
errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Falló {{ flow.id }} (week_idx={{ outputs.compute_week.values.week_idx ?? 'desconocida' }}): {{ errorLogs()[0].message ?? 'sin mensaje' }}"

  - id: log_failed_status
    type: io.kestra.plugin.jdbc.snowflake.Query
    sql: |
      INSERT INTO M5.BRONZE.LOAD_LOG (batch_id, flow_id, week_idx, table_name, rows_loaded, status, error_message)
      VALUES (
        '{{ execution.id }}', '{{ flow.id }}', {{ outputs.compute_week.values.week_idx ?? 'NULL' }}, 'SALES_RAW', 0, 'FAILED',
        '{{ (errorLogs()[0].message ?? 'sin mensaje') | replace({"'": "''"}) | abbreviate(1000) }}'
      );

# Sábados 06:00 UTC. timezone explícito: la cuenta de semanas asume que la fecha del tick cae en sábado (UTC),
# igual que el ancla. Si se cambia a una zona local, revisar que el tick siga siendo sábado en UTC.
# recoverMissedSchedules: ALL → si Kestra estuvo apagado, al volver lanza cada sábado perdido (una semana por tick).
triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 6"
    timezone: UTC
    recoverMissedSchedules: ALL
