services:
  postgres:
    image: postgres:16.15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
  kestra: 
    image: kestra/kestra:v1.3.40
    # Kestra, by default, has a termination grace period of 5m. We need to wait a little more to be sure no active tasks are running.
    stop_grace_period: 6m
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    env_file: .env
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      # Flows versionados. Nombre de archivo obligatorio: <tenant>_<namespace>_<id>.yml (ej. main_m5.pipeline_hello.yml)
      - ./kestra:/app/flows
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            driverClassName: org.postgresql.Driver
            username: "${POSTGRES_USER}"
            password: "${POSTGRES_PASSWORD}"
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /app/flows
        kestra:
          server:
            basic-auth:
              username: "${KESTRA_USER}" # it must be a valid email address
              password: "${KESTRA_PASSWORD}" # it must be at least 8 characters long with uppercase letter and a number
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
          # No cargar los flows de ejemplo ("Getting Started") al iniciar
          tutorial-flows:
            enabled: false
    ports:
      - "8080:8080"
      # The following is the management port, not exposed by default.
      # Note that exposing the management port is intended for development purpose as this port is un-authenticated by default
      # and expose sensitive information and actions.
      # - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
  
volumes:
  postgres_data:
  kestra_data: